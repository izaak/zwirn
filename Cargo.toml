[package]
name = "zwirn"
version = "0.1.0-beta.1"
edition = "2024"
rust-version = "1.87"
description = "Synchronize Lua, Lyte, and GLSL fragments between Audulus 4 documents and source files"
repository = "https://github.com/izaak/zwirn"
readme = "README.md"
license = "MIT"
publish = false

[dependencies]
cap-std = "4.0"
clap = { version = "4.6", features = ["derive"] }
sha2 = "0.11"
thiserror = "2"

[target.'cfg(target_os = "macos")'.dependencies]
signal-hook = { version = "0.4.4", default-features = false, features = ["iterator"] }

[dev-dependencies]
tempfile = "3"
